<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powertech — Billing & Stock (Cloud)</title>
<style>
:root{
  --side:var(--pri2); --side2:var(--pri); --ink:#15241E; --muted:#5D6B65;
  --paper:#F3F6F4; --card:#FFFFFF; --line:#D9E1DC; --brass:#D9A31A; --brass2:#B98710;
  --red:#B5322A; --green:#1D7A49; --blue:#2458A6;
  --pri:#0E7C5A; --pri2:#0B5E45; --tint:#E6F4EE;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",Tahoma,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.45}
.num,td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
#side{background:var(--side);color:#E6EFEA;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:auto}
.brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;font-size:22px;letter-spacing:.3px}
.brand span{font-size:12px;opacity:.7}
#nav{padding:8px 0}
#nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 20px;background:none;border:0;border-left:3px solid transparent;color:inherit;text-align:left}
#nav button:hover{background:rgba(255,255,255,.05)}
#nav button.on{background:var(--side2);border-left-color:var(--brass);font-weight:600}
#nav svg{width:18px;height:18px;flex:none;opacity:.9}
.quick{margin-top:auto;padding:14px;display:grid;gap:8px;border-top:1px solid rgba(255,255,255,.08)}
.quick button{background:var(--brass);color:#2B2000;border:0;border-radius:6px;padding:9px 10px;font-weight:600;text-align:left}
.quick button.alt{background:transparent;color:#E6EFEA;border:1px solid rgba(255,255,255,.25)}
.quick small{opacity:.6;font-size:11px;display:block;text-align:center;margin-top:4px}

main{min-width:0}
#top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#top h1{font-size:18px;margin:0;flex:1}
#top .co{color:var(--muted);font-size:13px}
.menu{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 9px}
#view{padding:20px 24px 100px;max-width:1300px}
#scrim{display:none}

.btn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 14px;color:var(--ink)}
.btn:hover{border-color:#B9C6BF}
.btn.pri{background:var(--pri);border-color:var(--pri2);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--pri2)}
.btn.dark{background:var(--side);border-color:var(--side);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.wa{background:#1F8F55;border-color:#1F8F55;color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.red{color:var(--red)} .green{color:var(--green)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px}
.panel h3{margin:0;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--line)}
.pad{padding:14px 16px}
.mt{margin-top:16px}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.strip>div{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.strip .k{font-size:12.5px;color:var(--muted)}
.strip .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}

.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:#F8FAF9;white-space:nowrap}
.tbl td{white-space:nowrap;padding:9px 12px;border-bottom:1px solid #EDF1EE;vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#F7FBF8}
.scroll{overflow-x:auto}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.tag.paid{color:var(--green);border-color:#A9D5BC;background:#EEF8F2}
.tag.part{color:#8A5A00;border-color:#E8CF92;background:#FFF7E3}
.tag.unpaid{color:var(--red);border-color:#E7B3AE;background:#FDF0EE}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}

label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.in{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.in:focus{border-color:var(--side2);outline:none;box-shadow:0 0 0 3px rgba(23,90,68,.12)}
select.in{padding:7px 8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

/* editor */
.ed-top{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.pbal{font-size:13px;margin-top:6px}
.additem{position:relative;margin:16px 0 0}
.additem .in{padding:11px 12px;font-size:15px;border-width:2px}
#sugg{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:0 0 8px 8px;box-shadow:0 8px 20px rgba(0,0,0,.08);z-index:8;max-height:300px;overflow:auto;display:none}
#sugg div{padding:9px 12px;display:flex;gap:10px;cursor:pointer;border-bottom:1px solid #F0F3F1}
#sugg div.on,#sugg div:hover{background:#F3F8F5}
.lines td{padding:5px 6px}
.lines .in{padding:6px 7px}
.lines .w-q{width:76px}.lines .w-r{width:100px}.lines .w-p{width:64px}
.ed-foot{display:grid;grid-template-columns:1fr 360px;gap:16px;margin-top:16px}
.tot{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tot .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #EEF2EF}
.tot .r .in{width:130px;text-align:right}
.tot .grand{background:var(--side);color:#fff;font-size:19px;font-weight:700;padding:12px 14px}
.tot .grand span:last-child{color:#FFD465}
.actbar{position:fixed;left:260px;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 24px;display:flex;gap:10px;flex-wrap:wrap;z-index:6}
.profit{font-size:12.5px;color:var(--green)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(12,30,23,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:40;overflow:auto}
#modal.show{display:flex}
.mbox{background:#fff;border-radius:10px;width:100%;max-width:620px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mbox.wide{max-width:900px}
.mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font-size:17px;flex:1}
.mbody{padding:16px 18px}
.mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted)}
#preview{width:100%;height:62vh;border:1px solid var(--line);border-radius:6px;background:#EEE}

#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.show{opacity:1}
#printFrame{position:fixed;left:0;top:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none}

.blink{background:none;border:0;color:#FFD465;padding:0;font-size:12px;text-decoration:underline;display:block;margin-top:5px}
.who{font-size:12px;margin-top:6px;opacity:.85}
.salesman .adm-only{display:none!important}
#login{position:fixed;inset:0;background:var(--side);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
#login.show{display:flex}
#login .box{background:#fff;border-radius:12px;padding:26px;width:100%;max-width:360px}
.plist{max-height:70vh;overflow:auto}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.calc-grid button{padding:14px 0;font-size:18px}
[dir=rtl] body{font-family:"Segoe UI","Noto Naskh Arabic","Urdu Typesetting",Tahoma,sans-serif}
[dir=rtl] .tbl th{text-align:right}[dir=rtl] .tbl th.num,[dir=rtl] .tbl td.num,[dir=rtl] .num{text-align:left}
[dir=rtl] #nav button{text-align:right;border-left:0;border-right:3px solid transparent}[dir=rtl] #nav button.on{border-right-color:var(--brass)}
[dir=rtl] .quick button{text-align:right}[dir=rtl] .actbar{left:0;right:260px}
[dir=rtl] input[type=number],[dir=rtl] input[type=date],[dir=rtl] input[type=time],[dir=rtl] #edPhone,[dir=rtl] #lgP{direction:ltr}
@media (max-width:900px){[dir=rtl] .actbar{right:0}}
/* ---- app-style layout (phase 6) ---- */
#side{background:#fff;color:#2E3A35;border-right:1px solid var(--line)}
.brand{background:var(--pri);color:#fff;padding:18px;display:flex;gap:12px;align-items:center;border:0}
.brand .lg{width:54px;height:54px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;color:var(--pri)}
.brand .lg img{width:100%;height:100%;object-fit:contain}.brand .lg svg{width:30px;height:30px}
.brand .nm{font-size:17px;font-weight:700;line-height:1.25;word-break:break-word}.brand .ph{font-size:13px;opacity:.9}
.brand .chg{background:none;border:0;color:#fff;padding:5px 0 0;font-size:13.5px;display:flex;align-items:center;gap:4px;white-space:nowrap;text-align:left}
#nav{padding:4px 0}
#nav button{color:#2E3A35;font-size:14.5px;padding:12px 18px}
#nav button:hover{background:#F5F8F6}
#nav button.on{background:var(--tint);border-left-color:var(--pri);color:var(--pri2)}
#nav .caret{margin-left:auto;transition:transform .15s;opacity:.55;width:16px!important;height:16px!important}
#nav .grp.open>.gbtn .caret{transform:rotate(180deg)}
#nav .sub{background:#F2F4F3;display:none}
#nav .grp.open>.sub{display:block}
#nav .si{display:flex;align-items:center}
#nav .si>button:first-child{padding-left:50px;color:#56645E;flex:1;min-width:0}
#nav .si small{display:block;font-size:11px;opacity:.75}
#nav .plus{width:auto!important;flex:none;padding:8px 16px!important;color:#7F8B86!important;border-left:0!important}
#nav .plus svg{width:22px;height:22px}
#nav hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#nav .gsub{display:block;font-size:11px;color:var(--muted);font-weight:400}
.sidefoot{margin-top:auto;padding:10px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
[dir=rtl] #nav .si>button:first-child{padding-left:18px;padding-right:50px}[dir=rtl] #nav .caret{margin-left:0;margin-right:auto}[dir=rtl] #side{border-right:0;border-left:1px solid var(--line)}
.fab{position:fixed;bottom:22px;left:calc(260px + (100vw - 260px)/2);transform:translateX(-50%);background:var(--pri);color:#fff;border:0;border-radius:30px;padding:13px 26px;font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:20;display:flex;align-items:center;gap:8px;white-space:nowrap}
.fab svg{width:22px;height:22px}
[dir=rtl] .fab{left:calc((100vw - 260px)/2)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #EEF1EF;background:#fff;cursor:pointer}
.lrow:hover{background:#FAFCFB}
.av{width:42px;height:42px;border-radius:50%;background:var(--tint);color:var(--pri2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;overflow:hidden;font-size:17px}
.av img{width:100%;height:100%;object-fit:cover}
.lrow .mn{flex:1;min-width:0}.lrow .mn b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lrow .mn small{color:var(--muted)}
.lrow .rt{text-align:right;white-space:nowrap}.lrow .rt small{display:block;color:var(--muted);font-size:11.5px}
[dir=rtl] .lrow .rt{text-align:left}
.search{position:relative;margin-bottom:12px}.search input{padding:12px 14px 12px 44px;border-radius:10px;border:1px solid var(--line);width:100%;font:inherit;font-size:15px;background:#fff}
.search input:focus{outline:none;border-color:var(--pri)}.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--pri)}
[dir=rtl] .search input{padding:12px 44px 12px 14px}[dir=rtl] .search svg{left:auto;right:14px}
.tabs.caps{background:#fff;margin:-20px -24px 14px;padding:0 12px}.tabs.caps button{text-transform:uppercase;letter-spacing:.3px;font-weight:600;flex:1;padding:14px 10px}
.fpage{max-width:720px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 18px 22px}
.fl{position:relative;margin-top:20px}
.fl input,.fl select,.fl textarea{width:100%;font:inherit;font-size:15px;padding:14px 12px;border:1px solid #B5C0BA;border-radius:6px;background:#fff;color:var(--ink);min-height:50px}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:none;border:2px solid var(--pri);padding:13px 11px}
.fl label{position:absolute;left:10px;top:-9px;background:#fff;padding:0 5px;font-size:12.5px;color:var(--muted);pointer-events:none;transition:all .15s;line-height:1.3}
.fl input:focus+label,.fl textarea:focus+label,.fl select:focus+label{color:var(--pri)}
.fl input:placeholder-shown:not(:focus)+label,.fl textarea:placeholder-shown:not(:focus)+label{top:15px;font-size:15px}
.fl .chip{position:absolute;right:8px;top:7px;background:var(--tint);color:var(--pri2);border:0;border-radius:20px;padding:9px 14px;font-weight:600;font-size:13.5px}
.fl.has-chip input{padding-right:150px}
[dir=rtl] .fl label{left:auto;right:10px}[dir=rtl] .fl .chip{right:auto;left:8px}[dir=rtl] .fl.has-chip input{padding-right:12px;padding-left:150px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fpage h4{margin:20px 0 0;font-size:14.5px;color:#36433D;padding-bottom:8px;border-bottom:1px solid #EEF1EF}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:22px;overflow:hidden}.seg button{border:0;background:#fff;padding:7px 16px;color:var(--muted)}.seg button.on{background:var(--pri);color:#fff}
.flink{background:none;border:0;color:var(--pri);font-weight:600;padding:14px 0 0;display:inline-flex;align-items:center;gap:6px;font-size:14.5px}
.ftabs{display:flex;border-bottom:1px solid var(--line);margin:22px -18px 0;background:#fff}.ftabs button{flex:1;background:none;border:0;padding:13px 8px;color:var(--muted);border-bottom:3px solid transparent;font-weight:600}.ftabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.fpanel{display:none}.fpanel.on{display:block}
.formbar{position:fixed;left:260px;right:0;bottom:0;display:flex;z-index:6;box-shadow:0 -2px 10px rgba(0,0,0,.06)}.formbar button{flex:1;border:0;padding:16px;font-size:16px;font-weight:600;background:#fff;color:#4A5751;border-top:1px solid var(--line)}.formbar button.pri{background:var(--pri);color:#fff;border-top-color:var(--pri)}
[dir=rtl] .formbar{left:0;right:260px}
.emptyst{text-align:center;padding:48px 16px;color:#46534D;font-size:15px}.emptyst svg{width:150px;height:auto;margin-bottom:10px}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
@media (max-width:900px){.fab{left:50%}[dir=rtl] .fab{left:50%}.formbar{left:0}[dir=rtl] .formbar{right:0}.tabs.caps{margin:-14px -12px 12px}.frow{grid-template-columns:1fr}}
.banner{border:1px solid #E8CF92;background:#FFF9E8;border-radius:8px;padding:12px 16px;margin-bottom:16px}
.plist .p{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid #EEF2EF;cursor:pointer}
.plist .p.on{background:#EEF6F1;box-shadow:inset 3px 0 0 var(--side2)}
.plist .p small{display:block;color:var(--muted)}

@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-100%);transition:transform .2s;z-index:30}
  #side.open{transform:none}
  #scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .menu{display:inline-flex}
  #view{padding:14px 12px 110px}
  #top{padding:10px 12px}
  #top .co{display:none}
  .grid2,.ed-top,.ed-foot{grid-template-columns:1fr}
  .actbar{left:0;padding:10px 12px}
  .hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- phase 7 ---- */
.btabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.btabs .bt{border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 12px;font-size:13px;color:var(--muted);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.btabs .bt.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}.btabs .bt.add{color:var(--pri);border-style:dashed}
.posg{display:grid;grid-template-columns:1fr 360px;gap:16px}.posbox{min-height:340px}.posk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.posk .btn{background:var(--tint);border-color:transparent;color:var(--pri2);padding:10px 6px;font-size:13px}
.postot{background:var(--tint);border-radius:8px;padding:12px 14px;margin:14px 0}.postot #posTotal{font-size:30px;font-weight:800;color:var(--pri2);font-variant-numeric:tabular-nums}
.poschg{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:10px 14px;border:1px dashed var(--line);border-radius:8px}.poschg b{font-size:22px}
.possel td{background:#FFF7E3!important}body.posmode .fab{display:none!important}
.frow1{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-bottom:1px solid #EEF2EF;cursor:pointer}.frow1.on,.frow1:hover{background:var(--tint)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 7px;font-size:12px;background:#F8FAF9;white-space:nowrap}
.more{position:relative}.more .mmenu{display:none;position:absolute;bottom:100%;left:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:230px;z-index:50;padding:4px 0}.more.open .mmenu{display:block}.more .mmenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 14px}.more .mmenu button:hover{background:var(--tint)}
[dir=rtl] .more .mmenu{left:auto;right:0}[dir=rtl] .more .mmenu button{text-align:right}
.chartwrap svg{display:block;max-height:240px}
.attc{position:relative;display:inline-block}.attc img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer}.attc button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:13px;line-height:1;padding:0}
body.privacy .strip .v,body.privacy td.num,body.privacy .lrow .rt b,body.privacy .pbal,body.privacy #nav .num,body.privacy .plist .num,body.privacy .tot span,body.privacy .postot{filter:blur(6px)}
@media (max-width:900px){.posg{grid-template-columns:1fr}.posk{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand" id="brand"><b>Powertech</b><span>Billing · Stock · Khata</span></div>
    <nav id="nav"></nav>
    <div class="sidefoot">Powertech · Alt+Z POS · Alt+S sale · Ctrl+F find · F9 calculator · F1 all shortcuts</div>
  </aside>
  <div id="scrim" onclick="toggleSide(false)"></div>
  <main>
    <header id="top">
      <button class="menu" onclick="toggleSide(true)" aria-label="Menu">☰</button>
      <h1 id="title">Dashboard</h1>
      <span class="co" id="coName"></span>
      <button class="btn sm" id="bellBtn" onclick="notifOpen()" title="Notifications (Shift+4)">🔔</button>

<script>
/* ============ Powertech v1 (Phase 1) — offline single file ============ */
const FIRMS_KEY='powertech_firms';let firms;
function loadFirms(){try{firms=JSON.parse(localStorage.getItem(FIRMS_KEY))}catch(e){firms=null}
  if(!firms||!Array.isArray(firms.list)||!firms.list.length)firms={cur:'main',list:[{id:'main'}]};
  if(!firms.list.some(f=>f.id===firms.cur))firms.cur=firms.list[0].id}
function saveFirms(){try{localStorage.setItem(FIRMS_KEY,JSON.stringify(firms))}catch(e){}}
const keyFor=id=>id==='main'?'powertech_db_v1':'powertech_db_'+id;
function dbKey(){return keyFor(firms.cur)}
const T={
  sale:{label:'Sale Invoice',short:'Sale',items:true,sign:1,stock:-1,cash:1,paid:'Received',mod:'sale',price:'sale'},
  estimate:{label:'Estimate / Quotation',short:'Estimate',items:true,sign:0,stock:0,cash:0,paid:null,mod:'sale',price:'sale'},
  proforma:{label:'Proforma Invoice',short:'Proforma',items:true,sign:0,stock:0,cash:0,paid:null,mod:'sale',price:'sale'},
  ptransfer:{label:'Party to Party Transfer',short:'Party Transfer',items:false,sign:0,stock:0,cash:0,mod:'sale'},
  paymentin:{label:'Payment In',short:'Payment In',items:false,sign:-1,stock:0,cash:1,mod:'sale'},
  salereturn:{label:'Sale Return',short:'Sale Return',items:true,sign:-1,stock:1,cash:-1,paid:'Refunded',mod:'sale',price:'sale'},
  purchase:{label:'Purchase Bill',short:'Purchase',items:true,sign:-1,stock:1,cash:-1,paid:'Paid',mod:'purchase',price:'purchase'},
  paymentout:{label:'Payment Out',short:'Payment Out',items:false,sign:1,stock:0,cash:-1,mod:'purchase'},
  purchasereturn:{label:'Purchase Return',short:'Purchase Return',items:true,sign:1,stock:-1,cash:1,paid:'Received back',mod:'purchase',price:'purchase'},
  saleorder:{label:'Sale Order',short:'Sale Order',items:true,sign:0,stock:0,cash:0,paid:null,mod:'sale',price:'sale'},
  challan:{label:'Delivery Challan',short:'Challan',items:true,sign:0,stock:0,cash:0,paid:null,mod:'sale',price:'sale'},
  purchaseorder:{label:'Purchase Order',short:'Purchase Order',items:true,sign:0,stock:0,cash:0,paid:null,mod:'purchase',price:'purchase'},
  expense:{label:'Expense',short:'Expense',items:false,sign:0,stock:0,cash:-1,mod:'expense',cat:'expenseCats'},
  income:{label:'Other Income',short:'Other Income',items:false,sign:0,stock:0,cash:1,mod:'expense',cat:'incomeCats'}
};
const MOD={sale:['sale','estimate','proforma','saleorder','challan','paymentin','salereturn','ptransfer'],purchase:['purchase','purchaseorder','paymentout','purchasereturn'],expense:['expense','income']};
function modes(){return['Cash',...db.banks.map(b=>b.name),'Cheque']}

function defaultDB(){return{
  settings:{company:'',phone:'',address:'',ntn:'',logo:'',currency:'Rs',taxOn:false,showProfit:true,
    printFormat:'thermal80',openingCash:0,footer:'Shukriya! Dobara tashreef layen.',terms:'',batchOn:false,freeOn:false,showTime:false,extraFields:false,costMethod:'avg',taxInclusive:false,itemFields:[],partyFields:[],printCF:true,mainGodown:'Main shop',theme:'green',layout:'modern',lastBackup:0,reminderDays:15,reminderMsg:'Assalam o Alaikum {name},\n\nAap ke khatay mein {amount} baqaya hain. Meharbani kar ke jald adaigi kar dein.\n\n{shop}\n{phone}',
    stopNeg:false,lowPopup:true,lineDesc:false,showCode:false,roundMode:'nearest',roundTo:1,noPreview:false,histOn:true,email:'',
    pr:{},itemX:{},serialOn:false,updPrice:false,showLast5:false,showCost:false,amtDec:2,
    svcOn:false,svcMsg:'Assalam o Alaikum {name},\n\nAap ki {item} ki service ka waqt ho gaya hai ({date}). Tashreef layen.\n\n{shop}\n{phone}',loyalty:{on:false,earnPer:100,ptVal:1},
    pfMeta:{},blockNewParty:false,blockNewItem:false,payDisc:true,dashCards:['rec','pay','cash','bank','mexp','stock','today','month'],mods:{},charges:[],transFields:[],billFields:[],billTax:false,payTerms:[7,15,30],lite:false,
    prefixes:{proforma:'PI-',ptransfer:'PT-',sale:'INV-',estimate:'EST-',paymentin:'RCV-',salereturn:'SR-',purchase:'PUR-',paymentout:'PAY-',purchasereturn:'PR-',expense:'EXP-',income:'INC-',saleorder:'SO-',challan:'DC-',purchaseorder:'PO-'},
    counters:{}},
  held:[],assets:[],svcDone:{},expItems:[],taxRates:[{name:'Sales tax 17%',rate:17},{name:'Sales tax 18%',rate:18}],
  parties:[],items:[],txns:[],adjustments:[],transfers:[],users:[],loans:[],loanTx:[],godowns:[],gdTransfers:[],mfg:[],
  banks:[{id:'b_bank',name:'Bank',opening:0},{id:'b_jc',name:'JazzCash',opening:0},{id:'b_ep',name:'Easypaisa',opening:0}],
  expenseCats:['Shop rent','Electricity bill','Salary','Transport','Tea & food','Shop maintenance','Mobile & internet','Other'],
  incomeCats:['Commission','Rent received','Service charges','Other'],
  categories:['General'],units:['Pcs','Kg','Gram','Ltr','Box','Dozen','Mtr','Ft','Set','Pair','Packet']
}}
let db;
function load(){_avg=null;
  try{db=JSON.parse(localStorage.getItem(dbKey()))}catch(e){db=null}
  const d=defaultDB();
  if(!db||typeof db!=='object')db=d;
  for(const k in d)if(db[k]===undefined)db[k]=d[k];
  for(const k in d.settings)if(db.settings[k]===undefined)db.settings[k]=d.settings[k];
  for(const k in d.settings.prefixes)if(db.settings.prefixes[k]===undefined)db.settings.prefixes[k]=d.settings.prefixes[k];
}
function save(){_avg=null;try{localStorage.setItem(dbKey(),JSON.stringify(db));scheduleAutoBackup();return true}catch(e){toast('Could not save — storage is full. Take a backup and remove old logo/data.');return false}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const fmt=n=>r2(n).toLocaleString('en-PK',{maximumFractionDigits:(typeof db!=='undefined'&&db&&db.settings&&db.settings.amtDec!=null)?Math.min(3,+db.settings.amtDec):2});
const money=n=>db.settings.currency+' '+fmt(n);
function localDate(d=new Date()){return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function dmy(s){if(!s)return'';const[y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}
function party(id){return db.parties.find(p=>p.id===id)}
function item(id){return db.items.find(i=>i.id===id)}
function txSort(a,b){return (b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0)}
function waPhone(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('0'))d='92'+d.slice(1);else if(d.length===10&&d.startsWith('3'))d='92'+d;return d}
function wordsIN(n){
  n=Math.floor(Math.abs(n));if(!n)return'Zero Rupees Only';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
  let s='';if(cr)s+=three(cr)+' Crore ';if(lk)s+=two(lk)+' Lakh ';if(th)s+=two(th)+' Thousand ';if(n)s+=three(n);
  return s.trim()+' Rupees Only';
}

/* ---------- core calculations ---------- */
function partyEffect(t,pid){const m=T[t.type];if(!m)return 0;if(t.type==='ptransfer')return(pid&&pid===t.party2Id)?+t.total:-t.total;
  return m.items?m.sign*(t.total-t.paid):m.sign*((+t.total||0)+(+t.pdisc||0))}
function moneyParts(t){const m=T[t.type];if(!m||!m.cash)return[];
  if(t.splits&&t.splits.length)return t.splits.filter(s=>+s.amt).map(s=>({acc:s.mode||'Cash',date:t.date,amt:m.cash*(+s.amt)}));
  const a=moneyAcc(t);if(!a)return[];const amt=m.cash*(+t.paid||0);return amt?[{acc:a,date:moneyDate(t),amt}]:[]}
function txMoney(t){return moneyParts(t).reduce((s,x)=>s+x.amt,0)}
function moneyAcc(t){if(t.mode==='Cheque')return t.chequeStatus==='closed'?(t.chequeAccount||'Cash'):null;return t.mode||'Cash'}
function moneyDate(t){return t.mode==='Cheque'?(t.chequeClearDate||t.date):t.date}
function calc(upto){
  const U=upto||'9999-12-31';
  const pb={},st={},acc={Cash:+db.settings.openingCash||0};
  db.banks.forEach(b=>acc[b.name]=+b.opening||0);
  db.parties.forEach(p=>pb[p.id]=(+p.opening||0)*(p.openingType==='pay'?-1:1));
  const svc={};db.items.forEach(i=>{if(i.type==='service'){svc[i.id]=1;st[i.id]=0}else st[i.id]=+i.openingStock||0});
  for(const t of db.txns){
    const m=T[t.type];if(!m||t.date>U)continue;
    if(t.partyId&&pb[t.partyId]!==undefined)pb[t.partyId]+=partyEffect(t,t.partyId);
    if(t.party2Id&&pb[t.party2Id]!==undefined)pb[t.party2Id]+=partyEffect(t,t.party2Id);
    if(m.stock)(t.lines||[]).forEach(l=>{if(l.itemId&&st[l.itemId]!==undefined&&!svc[l.itemId])st[l.itemId]+=m.stock*baseQty(l)});
    moneyParts(t).forEach(x=>{if(x.date<=U)acc[x.acc]=(acc[x.acc]||0)+x.amt});
  }
  db.adjustments.forEach(a=>{if(a.date<=U&&st[a.itemId]!==undefined&&!svc[a.itemId])st[a.itemId]+=a.mode==='add'?+a.qty:-a.qty});
  (db.mfg||[]).forEach(x=>{if(x.date>U)return;if(st[x.itemId]!==undefined&&!svc[x.itemId])st[x.itemId]+=+x.qty;(x.raw||[]).forEach(r=>{if(st[r.itemId]!==undefined&&!svc[r.itemId])st[r.itemId]-=+r.qty})});
  db.transfers.forEach(x=>{if(x.date>U)return;if(x.from)acc[x.from]=(acc[x.from]||0)-x.amount;if(x.to)acc[x.to]=(acc[x.to]||0)+(+x.amount)});
  const lb={};db.loans.forEach(l=>lb[l.id]=+l.opening||0);
  db.loanTx.forEach(x=>{if(x.date>U)return;const p=+x.principal||0,i=+x.interest||0;if(x.kind==='emi'){acc[x.acc]=(acc[x.acc]||0)-p-i;lb[x.loanId]=(lb[x.loanId]||0)-p}else{acc[x.acc]=(acc[x.acc]||0)+p;lb[x.loanId]=(lb[x.loanId]||0)+p}});
  (db.assets||[]).forEach(a=>{if(a.date<=U&&a.acc&&!a.cashDone)acc[a.acc]=(acc[a.acc]||0)-(+a.cost||0);if(a.soldDate&&a.soldDate<=U&&a.soldAcc)acc[a.soldAcc]=(acc[a.soldAcc]||0)+(+a.soldAmt||0)});
  return{pb,st,acc,lb,cash:acc.Cash};
}
function lineCalc(l){
  const amt=(+l.qty||0)*(+l.rate||0);const disc=amt*(+l.disc||0)/100;
  if(l.incl&&+l.tax){const k=1+(+l.tax)/100;const after=amt-disc;return{amt:amt/k,disc:disc/k,tax:after-after/k,total:after}}
  const taxable=amt-disc;const tax=taxable*(+l.tax||0)/100;
  return{amt,disc,tax,total:taxable+tax};
}
function txCalc(e){
  let sub=0,disc=0,tax=0;
  (e.lines||[]).forEach(l=>{const c=lineCalc(l);sub+=c.amt;disc+=c.disc;tax+=c.tax});
  let xc=0;(e.xch||[]).forEach(x=>{const a=+x.a||0;xc+=a;tax+=a*(+x.tx||0)/100});
  const bt=+e.billTaxPct?(sub-disc-(+e.billDisc||0))*(+e.billTaxPct)/100:0;tax+=bt;
  let total=sub-disc+tax-(+e.billDisc||0)+(+e.charges||0)+xc-(+e.ptsDisc||0);const tcs=+e.tcsPct?r2(total*(+e.tcsPct)/100):0;tax+=tcs;total+=tcs;
  let round=0;if(e.roundOff){const to=+e.roundTo||1;const fn=e.roundMode==='up'?Math.ceil:e.roundMode==='down'?Math.floor:Math.round;const nt=fn(r2(total)/to)*to;round=nt-total;total=nt}
  return{sub,disc,tax,tcs,btax:bt,xc,round:r2(round),total:r2(total)};
}

/* ---------- transaction lists ---------- */
function rangeDates(){
  const d=new Date(),td=localDate();
  if(ui.range==='today')return[td,td];
  if(ui.range==='month')return[td.slice(0,8)+'01',td];
  if(ui.range==='lastmonth'){const f=new Date(d.getFullYear(),d.getMonth()-1,1),l=new Date(d.getFullYear(),d.getMonth(),0);return[localDate(f),localDate(l)]}
  if(ui.range==='year'){const y=d.getMonth()>=6?d.getFullYear():d.getFullYear()-1;return[`${y}-07-01`,`${y+1}-06-30`]}
  if(ui.range==='quarter'){const q=Math.floor(d.getMonth()/3)*3;return[localDate(new Date(d.getFullYear(),q,1)),localDate(new Date(d.getFullYear(),q+3,0))]}
  if(ui.range==='calyear')return[`${d.getFullYear()}-01-01`,`${d.getFullYear()}-12-31`];
  if(ui.range==='custom')return[ui.from||'0000',ui.to||'9999'];
  return['0000','9999'];
}
function status(t){
  const m=T[t.type];if(t.cancelled)return'<span class="tag unpaid">Cancelled</span>';if(t.type==='ptransfer')return'<span class="tag">Transfer</span>';
  if(isDoc(t.type))return t.convertedTo?'<span class="tag paid">Converted</span>':'<span class="tag">Open</span>';
  if(!m.items)return`<span class="tag">${esc(t.mode||'Cash')}</span>`;
  const due=billDue(t);if(due<=0.005)return'<span class="tag paid">Paid</span>';
  return due<t.total-0.005?'<span class="tag part">Partial</span>':'<span class="tag unpaid">Unpaid</span>';
}

function partyBalText(pid){
  if(!pid)return'';const{pb}=calc();const b=pb[pid]||0;const p=party(pid);
  let s=b>0?`<span class="green">Will receive ${money(b)}</span>`:b<0?`<span class="red">Will pay ${money(-b)}</span>`:'<span class="muted">Balance clear</span>';
  if(p&&+p.creditLimit>0&&b>+p.creditLimit)s+=` <span class="red">· over credit limit (${money(p.creditLimit)})</span>`;
  if(p&&(db.settings.loyalty||{}).on){const pt=partyPoints(pid);if(pt)s+=` <span class="muted">· ${fmt(pt)} loyalty points</span>`}
  if(p&&p.inactive)s+=' <span class="tag">Inactive party</span>';
  return s;
}

function lastPrices(itemId){if(!ed)return[];const fam=T[ed.type].price;const out=[];
  for(const t of [...db.txns].sort(txSort)){if(t.cancelled||T[t.type].price!==fam||t.id===ed.id||(ed.partyId&&t.partyId!==ed.partyId))continue;const l=(t.lines||[]).find(x=>x.itemId===itemId);if(l){out.push(+l.rate);if(out.length>=5)break}}return out}

function lastRate(itemId){

function saveItemForm(id){

  const data={name,code,category:cat,unit,salePrice:+$('#iSP').value||0,purchasePrice:+$('#iPP').value||0,tax:$('#iTax')?+$('#iTax').value||0:(id?item(id).tax:0),openingStock:+$('#iOS').value||0,minStock:+$('#iMin').value||0,unit2:$('#iU2').value.trim(),factor:+$('#iF').value||0,type:$('#iType').value,wsPrice:+$('#iWS').value||0,wsQty:+$('#iWQ').value||0,cf:readCF('icf')};

  (db.mfg||[]).forEach(x=>{if(x.itemId===id)rows.push({d:x.date,c:x.created,txt:'Manufactured',who:x.note||'',q:+x.qty,rate:r2((+x.cost||0)/(+x.qty||1))});(x.raw||[]).forEach(r=>{if(r.itemId===id)rows.push({d:x.date,c:x.created,txt:'Used in manufacturing',who:(item(x.itemId)||{}).name||'',q:-r.qty,rate:''})})});

  rows.sort((a,b)=>b.d.localeCompare(a.d)||b.c-a.c);
  openModal(`<div class="mhead"><h2>${esc(i.name)}</h2><button class="x" onclick="closeModal()">×</button></div>

  <div class="scroll" style="max-height:50vh">${rows.length?`<table class="tbl"><tr><th>Date</th><th>Entry</th><th>Party / note</th><th class="num">Rate</th><th class="num">Qty</th></tr>${rows.map(r=>`<tr ${r.tid?`class="click" onclick="viewTx('${r.tid}')"`:''}><td>${dmy(r.d)}</td><td>${esc(r.txt)}</td><td>${esc(r.who)}</td><td class="num">${r.rate!==''?fmt(r.rate):''}</td><td class="num ${r.q<0?'red':'green'}">${r.q>0?'+':''}${fmt(r.q)}</td></tr>`).join('')}</table>`:'<div class="empty">No movement yet.</div>'}</div></div>

function accLedger(name,f,to){
  const rows=[];
  db.txns.forEach(t=>{const m=T[t.type];moneyParts(t).forEach(x=>{if(x.acc!==name)return;const p=party(t.partyId);
    rows.push({d:x.date,c:t.created||0,desc:`${m.short} ${t.no}`,who:p?p.name:(t.category||t.partyName||''),amt:x.amt,id:t.id})})});
  (db.assets||[]).forEach(a=>{if(a.acc===name&&!a.cashDone)rows.push({d:a.date,c:a.created||0,desc:'Fixed asset bought — '+a.name,who:a.note||'',amt:-(+a.cost||0)});if(a.soldDate&&a.soldAcc===name)rows.push({d:a.soldDate,c:a.created||0,desc:'Fixed asset sold — '+a.name,who:'',amt:+a.soldAmt||0})});
  db.transfers.forEach(x=>{
    if(x.from===name)rows.push({d:x.date,c:x.created||0,desc:x.to?`Transfer to ${x.to}`:'Money taken out',who:x.note||'',amt:-x.amount,xid:x.id});
    if(x.to===name)rows.push({d:x.date,c:x.created||0,desc:x.from?`Transfer from ${x.from}`:'Money added',who:x.note||'',amt:+x.amount,xid:x.id})});
  db.loanTx.forEach(x=>{if(x.acc!==name)return;const ln=db.loans.find(l=>l.id===x.loanId);const nm=ln?ln.name:'Loan';const emi=x.kind==='emi';
    rows.push({d:x.date,c:x.created||0,desc:emi?`Loan payment — ${nm}`:`Loan received — ${nm}`,who:emi&&+x.interest?`Interest ${fmt(x.interest)}`:(x.note||''),amt:emi?-((+x.principal||0)+(+x.interest||0)):+x.principal,lid:x.id})});
  rows.sort((a,b)=>a.d.localeCompare(b.d)||a.c-b.c);
  let open=accOpening(name);const out=[];
  rows.forEach(r=>{if(r.d<f)open+=r.amt;else if(r.d<=to)out.push(r)});
  let run=open;out.forEach(r=>{run+=r.amt;r.bal=run});
  return{open,rows:out,close:run};
}
function ledgerTable(name){

};
const NUMF=['salePrice','purchasePrice','openingStock','minStock','opening','creditLimit'];
function parseTable(txt){
  txt=String(txt||'').replace(/^\ufeff/,'');const first=txt.split(/\r?\n/)[0]||'';
  const d=first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"'&&f==='')q=true;else if(c===d){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
function mapRows(kind,rows){
  const cfg=IMP[kind].cols;const head=rows[0].map(h=>String(h).trim().toLowerCase());const idx={};
  cfg.forEach(([k,,al])=>{let i=head.findIndex(h=>al.includes(h));if(i<0)i=head.findIndex(h=>al.some(a=>h.includes(a)));idx[k]=i});
  if(idx.name<0)return{err:'The first row needs a “Name” column.'};
  const num=v=>{const n=parseFloat(String(v||'').replace(/[^\d.\-]/g,''));return isNaN(n)?0:n};
  const out=rows.slice(1).map(r=>{const o={};cfg.forEach(([k])=>{const v=idx[k]>=0?String(r[idx[k]]??'').trim():'';o[k]=NUMF.includes(k)?num(v):v});return o}).filter(o=>o.name);
  return{out,idx};
}

/* ---------- batch & expiry ---------- */
function batchStock(upto){
  const U=upto||'9999-12-31';const b={};
  const add=(id,bt,q,exp)=>{if(!id||(item(id)||{}).type==='service')return;b[id]=b[id]||{};const k=String(bt||'').trim();const e=b[id][k]=b[id][k]||{q:0,exp:''};e.q+=q;if(exp&&!e.exp)e.exp=exp};
  db.items.forEach(i=>{if(+i.openingStock)add(i.id,'',+i.openingStock)});
  db.txns.forEach(t=>{const m=T[t.type];if(!m||!m.stock||t.date>U)return;(t.lines||[]).forEach(l=>add(l.itemId,l.batch,m.stock*baseQty(l),l.exp))});
  db.adjustments.forEach(a=>{if(a.date<=U)add(a.itemId,a.batch||'',a.mode==='add'?+a.qty:-a.qty)});
  (db.mfg||[]).forEach(x=>{if(x.date>U)return;add(x.itemId,'',+x.qty);(x.raw||[]).forEach(r=>add(r.itemId,'',-r.qty))});
  return b;
}
function fefo(id){const b=batchStock()[id]||{};const L=Object.entries(b).filter(([k,v])=>k&&v.q>0).sort((x,y)=>(x[1].exp||'9999').localeCompare(y[1].exp||'9999'));return L.length?{batch:L[0][0],exp:L[0][1].exp}:null}
function batchOpts(id){if(!id)return'';const b=batchStock()[id]||{};return Object.entries(b).filter(([k,v])=>k&&v.q>0).map(([k,v])=>`<option value="${esc(k)}">${fmt(v.q)} left${v.exp?' · exp '+dmy(v.exp):''}</option>`).join('')}
function batchPick(i,v,done){const l=ed.lines[i];if(!l)return;l.batch=v;ed.dirty=true;if(done&&l.itemId){const e=(batchStock()[l.itemId]||{})[String(v).trim()];if(e&&e.exp&&!l.exp){l.exp=e.exp;drawLines();upd()}}}

/* ---------- payment reminders ---------- */
function dueBills(){
  const{pb}=calc();const td=localDate();const days=+db.settings.reminderDays||15;const out=[];
  db.parties.forEach(p=>{let rem=pb[p.id]||0;if(rem<=0.005)return;
    const sales=db.txns.filter(t=>t.partyId===p.id&&t.type==='sale').sort(txSort);
    for(const s of sales){if(rem<=0.005)break;const take=Math.min(rem,Math.max(0,s.total-s.paid-linkedAmt(s.id)));rem-=take;
      const dd=s.dueDate||localDate(new Date(new Date(s.date+'T12:00:00').getTime()+days*864e5));
      out.push({p,t:s,amt:take,due:dd,over:Math.round((new Date(td+'T12:00:00')-new Date(dd+'T12:00:00'))/864e5)})}
    if(rem>0.005)out.push({p,t:null,amt:rem,due:'',over:999})});
  return out;
}
function overdueParties(){const m={};dueBills().filter(b=>b.over>0).forEach(b=>{const k=b.p.id;m[k]=m[k]||{p:b.p,amt:0,days:0};m[k].amt+=b.amt;if(b.over!==999)m[k].days=Math.max(m[k].days,b.over)});return Object.values(m).sort((a,b)=>b.amt-a.amt)}

/* ---------- phase 4: helpers ---------- */
function baseQty(l){return((+l.qty||0)+(+l.free||0))*(+l.factor||1)}
function isDoc(type){const m=T[type];return!!(m&&m.items&&m.sign===0)}
function linkedAmt(id,exclude){let s=0;for(const t of db.txns){if(t.id===exclude||!t.links||!t.links.length)continue;for(const l of t.links)if(l.txId===id)s+=+l.amt||0}return s}
function billDue(t){return r2(t.total-t.paid-linkedAmt(t.id))}
function partyGroups(){return[...new Set(db.parties.map(p=>p.group).filter(Boolean))].sort()}
const THEMES={green:['#0E3B2C','#F3E6BC'],blue:['#1F3A68','#DCE6F5'],maroon:['#6B1E2A','#F5DFDF'],black:['#1A1A1A','#E8E8E8'],orange:['#8F4209','#FBE3CC'],purple:['#4B2A6B','#E9DFF4'],teal:['#0F5C63','#D6EFEF']};
let _avg=null;
function itemCost(id){
  const i=id&&item(id);if(!i)return 0;if(db.settings.costMethod==='last')return +i.purchasePrice||0;
  if(!_avg){_avg={};const q={},v={};db.items.forEach(x=>{q[x.id]=+x.openingStock||0;v[x.id]=q[x.id]*(+x.openPrice||+x.purchasePrice||0)});
    db.txns.forEach(t=>{if(t.type!=='purchase')return;(t.lines||[]).forEach(l=>{if(q[l.itemId]===undefined)return;const c=lineCalc(l);q[l.itemId]+=baseQty(l);v[l.itemId]+=c.amt-c.disc})});
    (db.mfg||[]).forEach(x=>{if(q[x.itemId]===undefined)return;q[x.itemId]+=+x.qty;v[x.itemId]+=+x.cost||0});
    db.items.forEach(x=>{_avg[x.id]=q[x.id]>0?v[x.id]/q[x.id]:(+x.purchasePrice||0)})}
  return _avg[id]??(+i.purchasePrice||0);
}
function unitPick(i,f){const l=ed.lines[i];const it=item(l.itemId);if(!it)return;const old=+l.factor||1;l.rate=r2((+l.rate||0)/old*f);l.factor=f;l.unit=f===1?it.unit:it.unit2;ed.dirty=true;drawLines();upd()}

function linkPanel(){
  if(!ed||!ed.partyId)return'';
  const bt=ed.type==='paymentin'?'sale':'purchase';ed.links=ed.links||[];
  const L=db.txns.filter(t=>t.type===bt&&t.partyId===ed.partyId).map(t=>({t,due:r2(t.total-t.paid-linkedAmt(t.id,ed.id))}))
    .filter(x=>x.due>0.005||ed.links.some(l=>l.txId===x.t.id)).sort((a,b)=>a.t.date.localeCompare(b.t.date));
  if(!L.length)return`<div class="muted mt">No unpaid ${bt==='sale'?'sale':'purchase'} bills for this party.</div>`;
  return`<div class="panel mt"><h3>Link this payment to bills <span class="muted" style="font-weight:400">(optional)</span></h3><div class="scroll"><table class="tbl"><tr><th></th><th>Bill</th><th>Date</th><th class="num">Pending</th><th class="num">Apply</th></tr>
  ${L.map(x=>{const lk=ed.links.find(l=>l.txId===x.t.id);return`<tr><td><input type="checkbox" ${lk?'checked':''} onchange="linkToggle('${x.t.id}',this.checked,${x.due})"></td><td>${esc(x.t.no)}</td><td>${dmy(x.t.date)}</td><td class="num">${fmt(x.due)}</td>
  <td class="num"><input class="in" style="width:110px;text-align:right" type="number" step="any" min="0" value="${lk?lk.amt:''}" oninput="linkAmt('${x.t.id}',+this.value)"></td></tr>`}).join('')}</table></div><div class="pad muted" id="linkSum"></div></div>`;
}
function linkToggle(id,on,due){
  ed.links=(ed.links||[]).filter(l=>l.txId!==id);
  if(on){const used=ed.links.reduce((a,l)=>a+(+l.amt||0),0);const left=r2((+ed.amount||0)-used);ed.links.push({txId:id,amt:left>0?Math.min(due,left):due})}
  const sum=r2(ed.links.reduce((a,l)=>a+(+l.amt||0),0));if(sum>(+ed.amount||0)){ed.amount=sum;const a=$('#edAmt');if(a)a.value=sum}
  ed.dirty=true;$('#links').innerHTML=linkPanel();linkSum();
}
function linkAmt(id,v){ed.links=ed.links||[];const lk=ed.links.find(l=>l.txId===id);if(lk)lk.amt=v;else if(v>0)ed.links.push({txId:id,amt:v});ed.dirty=true;linkSum()}
function linkSum(){const e=$('#linkSum');if(!e||!ed)return;const s=r2((ed.links||[]).reduce((a,l)=>a+(+l.amt||0),0));if(!s){e.textContent='Unlinked payments are applied to the oldest bills automatically.';return}
  const left=r2((+ed.amount||0)-s);e.innerHTML=`Linked: <b>${fmt(s)}</b>${left>0.005?` · not linked: ${fmt(left)}`:left<-0.005?` · <span class="red">more than the payment</span>`:''}`}

function calcKey(k){const i=$('#calcIn');if(k==='C')i.value='';else if(k==='⌫')i.value=i.value.slice(0,-1);else i.value+={'÷':'/','×':'*','−':'-'}[k]||k;calcRun();i.focus()}
function calcRun(){const v=$('#calcIn').value.replace(/,/g,'');const o=$('#calcOut');if(!v.trim()){o.textContent='0';return}if(!/^[\d+\-*/().%\s]*$/.test(v)){o.textContent='—';return}
  const ev=e=>Function('"use strict";return('+(e.replace(/(\d+(?:\.\d+)?)%/g,'($1/100)')||0)+')')();
  try{let r;const pm=v.match(/^(.*\S)\s*([+\-])\s*(\d+(?:\.\d+)?)%\s*$/);if(pm){const a=ev(pm[1]);r=pm[2]==='+'?a+a*pm[3]/100:a-a*pm[3]/100}else r=ev(v);o.textContent=isFinite(r)?fmt(r):'—'}catch(e){o.textContent='…'}}

let bkDir=null,bkHandle=null,bkNeedsResume=false,bkTimer=null;
function fsdb(){return new Promise((res,rej)=>{const r=indexedDB.open('powertech_fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fsGet(k){try{const d=await fsdb();return await new Promise(r=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function fsSet(k,v){try{const d=await fsdb();return await new Promise(r=>{const tx=d.transaction('h','readwrite');tx.objectStore('h').put(v,k);tx.oncomplete=()=>r(true);tx.onerror=()=>r(false)})}catch(e){return false}}
async function initAutoBackup(){if(!window.showDirectoryPicker)return;const h=await fsGet('dir');if(!h)return;bkHandle=h;

  nd.assets=(nd.assets||[]).filter(a=>!(a.soldDate&&a.soldDate<=end)).map(a=>{if(a.date<=end)a.cashDone=true;return a});nd.held=[];

let imgTmp;
function saleRate(it,bq){if(!it)return 0;const p=party(ed&&ed.partyId);const ws=+it.wsPrice||0;
  if(ws>0&&((p&&p.wholesale)||(+it.wsQty>0&&bq>=+it.wsQty)))return ws;return +it.salePrice||0}
function autoRateFor(l){const it=item(l.itemId);if(!it)return +l.rate||0;const f=+l.factor||1;
  const base=T[ed.type].price==='purchase'?(+it.purchasePrice||0):saleRate(it,baseQty(l));return r2(base*f)}
function wsCheck(i){const l=ed.lines[i];if(!l||!l.autoRate||!l.itemId)return;const r=autoRateFor(l);if(r!==+l.rate){l.rate=r;const inp=document.querySelectorAll('#lines .w-r')[i];if(inp)inp.value=r}}
function readCF(attr){const o={};document.querySelectorAll(`[data-${attr}]`).forEach(e=>{const v=e.value.trim();if(v)o[e.getAttribute('data-'+attr)]=v});return o}
function cfHTML(cf,fields,small){if(!cf)return'';const M=(db.settings.pfMeta)||{};const L=(fields||[]).filter(f=>cf[f]&&!(fields===db.settings.partyFields&&M[f]&&M[f].print===false)).map(f=>`${esc(f)}: ${esc(M[f]&&M[f].type==='date'&&fields===db.settings.partyFields?dmy(cf[f]):cf[f])}`);if(!L.length)return'';return`<div style="font-size:${small?'.85em':'.95em'};color:#5D6B65">${L.join(' · ')}</div>`}
function itemImg(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const sc=Math.min(1,220/Math.max(im.width,im.height));c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);imgTmp=c.toDataURL('image/jpeg',0.72);
  $('#iImgBox').innerHTML=`<img src="${imgTmp}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)">`};im.src=r.result};r.readAsDataURL(f)}

function godownList(){return[{id:'main',name:db.settings.mainGodown||'Main shop'},...(db.godowns||[])]}
function gdName(id){const g=godownList().find(x=>x.id===id);return g?g.name:'Main shop'}
function gdStock(){
  const g={};const add=(id,gd,q)=>{const it=item(id);if(!it||it.type==='service')return;g[id]=g[id]||{};const k=gd||'main';g[id][k]=(g[id][k]||0)+q};
  db.items.forEach(i=>{if(+i.openingStock)add(i.id,'main',+i.openingStock)});
  db.txns.forEach(t=>{const m=T[t.type];if(!m||!m.stock)return;(t.lines||[]).forEach(l=>add(l.itemId,t.gd,m.stock*baseQty(l)))});
  db.adjustments.forEach(a=>add(a.itemId,a.gd,a.mode==='add'?+a.qty:-a.qty));
  (db.mfg||[]).forEach(x=>{add(x.itemId,x.gd,+x.qty);(x.raw||[]).forEach(r=>add(r.itemId,x.gd,-r.qty))});
  (db.gdTransfers||[]).forEach(x=>{add(x.itemId,x.from,-x.qty);add(x.itemId,x.to,+x.qty)});
  return g;
}

function trText(t){const s=t.trim();if(!s)return null;let core=s,pre='',post='';if(core.endsWith(' *')){core=core.slice(0,-2);post=' *'}if(core.startsWith('+ ')){core=core.slice(2);pre='+ '}
  let u=UR[core];if(!u&&core.endsWith(' no.')&&UR[T[Object.keys(T).find(k=>T[k].short===core.slice(0,-4))]?.label]){u=UR[T[Object.keys(T).find(k=>T[k].short===core.slice(0,-4))].label]+' نمبر'}
  if(!u){if(core.startsWith('New ')&&UR[core.slice(4)])u='نیا '+UR[core.slice(4)];else if(core.startsWith('Edit ')&&UR[core.slice(5)])u='تبدیل: '+UR[core.slice(5)]}
  return u?t.replace(s,pre+u+post):null}
function trNode(root){
  if(LANG!=='ur'||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode;if(!p)return 2;if(/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName))return 2;if(p.nodeName==='OPTION'&&!p.hasAttribute('value'))return 2;return 1}});
  const L=[];while(w.nextNode())L.push(w.currentNode);L.forEach(n=>{const r=trText(n.data);if(r!==null)n.data=r});
  if(root.querySelectorAll)root.querySelectorAll('[placeholder],[title]').forEach(e=>['placeholder','title'].forEach(a=>{const v=e.getAttribute(a);if(v&&UR[v])e.setAttribute(a,UR[v])}));
}
const langObs=new MutationObserver(ms=>{if(LANG!=='ur')return;ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)trNode(n);else if(n.nodeType===3&&!(n.parentNode&&n.parentNode.nodeName==='OPTION'&&!n.parentNode.hasAttribute('value'))){const r=trText(n.data);if(r!==null)n.data=r}}))});
function applyLang(){const ur=LANG==='ur';document.documentElement.dir=ur?'rtl':'ltr';document.documentElement.lang=ur?'ur':'en';const b=$('#langBtn');if(b)b.textContent=ur?'English':'اردو';
  if(ur){langObs.observe(document.body,{childList:true,subtree:true});trNode(document.body)}}

  rec.tf=clean(ed.tf);rec.bf=clean(ed.bf);

  const live=t=>inR(t,f,to);
  const sum=(type)=>db.txns.filter(t=>t.type===type&&live(t)).reduce((s,t)=>s+(T[type].items?txNet(t):t.total),0);
  const sales=sum('sale'),sret=sum('salereturn'),pur=sum('purchase'),pret=sum('purchasereturn'),inc=sum('income'),exp=sum('expense');
  const os=stockVal(calc(prevDay(f)).st),cs=stockVal(calc(to).st);
  const li=db.loanTx.filter(x=>x.kind==='emi'&&x.date>=f&&x.date<=to).reduce((s,x)=>s+(+x.interest||0),0);
  const pdi=db.txns.filter(t=>t.type==='paymentin'&&live(t)).reduce((s,t)=>s+(+t.pdisc||0),0),pdo=db.txns.filter(t=>t.type==='paymentout'&&live(t)).reduce((s,t)=>s+(+t.pdisc||0),0);
  const ag=(db.assets||[]).filter(a=>a.soldDate&&a.soldDate>=f&&a.soldDate<=to).reduce((s,a)=>s+(+a.soldAmt||0)-(+a.cost||0),0);
  const cogs=os+pur-pret-cs,gross=sales-sret-cogs,net=gross+inc+pdo+ag-exp-li-pdi;
  const ec={};db.txns.filter(t=>t.type==='expense'&&live(t)).forEach(t=>ec[t.category||'Other']=(ec[t.category||'Other']||0)+t.total);
  const ic={};db.txns.filter(t=>t.type==='income'&&live(t)).forEach(t=>ic[t.category||'Other']=(ic[t.category||'Other']||0)+t.total);
  return{sales,sret,pur,pret,inc,exp,os,cs,li,pdi,pdo,ag,cogs,gross,net,ec,ic};
}

function emiOf(P,rate,n){P=+P||0;n=+n||0;const r=(+rate||0)/1200;if(!(P>0)||!(n>0))return 0;return r?P*r/(1-Math.pow(1+r,-n)):P/n}

/* ---------- phase 7: charts ---------- */
function salesBuckets(per){const td=new Date();const B=[];const key=d=>localDate(d);
  if(per==='weekly'){const s=new Date(td);s.setDate(s.getDate()-((s.getDay()+6)%7)-77);for(let i=0;i<12;i++){const a=new Date(s);a.setDate(a.getDate()+i*7);const b=new Date(a);b.setDate(b.getDate()+6);B.push({f:key(a),t:key(b),l:dmy(key(a)).slice(0,5)})}}
  else if(per==='monthly'){for(let i=11;i>=0;i--){const a=new Date(td.getFullYear(),td.getMonth()-i,1),b=new Date(td.getFullYear(),td.getMonth()-i+1,0);B.push({f:key(a),t:key(b),l:a.toLocaleString('en',{month:'short'})+(a.getMonth()===0||i===11?' '+String(a.getFullYear()).slice(2):'')})}}
  else if(per==='yearly'){for(let i=4;i>=0;i--){const y=td.getFullYear()-i;B.push({f:y+'-01-01',t:y+'-12-31',l:String(y)})}}
  else{for(let i=29;i>=0;i--){const a=new Date(td);a.setDate(a.getDate()-i);const k=key(a);B.push({f:k,t:k,l:k.slice(8)})}}
  db.txns.forEach(t=>{if(t.type!=='sale')return;const b=B.find(x=>t.date>=x.f&&t.date<=x.t);if(b)b.v=(b.v||0)+t.total});B.forEach(b=>b.v=b.v||0);return B}
function salesChart(per){const B=salesBuckets(per);const W=760,H=200,pl=52,pb=24,pt=10;const max=Math.max(1,...B.map(b=>b.v));
  const step=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/step)*step;const bw=(W-pl-8)/B.length;const y=v=>pt+(H-pt-pb)*(1-v/top);
  const grid=[0,.5,1].map(k=>`<line x1="${pl}" x2="${W}" y1="${y(top*k)}" y2="${y(top*k)}" stroke="#E3E9E6"/><text x="${pl-6}" y="${y(top*k)+4}" text-anchor="end" font-size="10.5" fill="#6B7772">${fmt(top*k)}</text>`).join('');
  const every=B.length>16?Math.ceil(B.length/10):1;
  const bars=B.map((b,i)=>{const x=pl+i*bw+bw*.18,w=Math.max(2,bw*.64),h=Math.max(b.v?2:0,y(0)-y(b.v));return`<g><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"><title>${b.f===b.t?dmy(b.f):dmy(b.f)+' – '+dmy(b.t)}: ${money(b.v)}</title></rect>${h?`<path d="M${x},${y(0)} v${-(h-3)} q0,-3 3,-3 h${w-6} q3,0 3,3 v${h-3} z" fill="var(--pri)" pointer-events="none"/>`:''}${i%every===0?`<text x="${pl+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#6B7772">${esc(b.l)}</text>`:''}</g>`}).join('');
  const tot=B.reduce((s,b)=>s+b.v,0);
  return`<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sales chart">${grid}<line x1="${pl}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#B9C6BF"/>${bars}</svg><div class="muted" style="font-size:12px">Total in this view: <b>${money(tot)}</b> · hover a bar to see its amount</div></div>`}
function chartSeg(cur,fn){return`<div class="seg">${[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly'],['yearly','Yearly']].map(([k,l])=>`<button class="${cur===k?'on':''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`}

function attBlock(){const A=ed.att||[];return`<div class="mt"><div class="row" style="gap:8px">${A.map((a,i)=>`<span class="attc"><img src="${a}" onclick="attShow(${i})" alt=""><button onclick="ed.att.splice(${i},1);ed.dirty=true;render()" aria-label="Remove">×</button></span>`).join('')}
  ${A.length<4?`<label class="btn sm">📎 Attach image / photo<input type="file" accept="image/*" hidden onchange="attAdd(this.files[0])"></label>`:''}</div></div>`}
function attAdd(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const sc=Math.min(1,900/Math.max(im.width,im.height));c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  ed.att=ed.att||[];ed.att.push(c.toDataURL('image/jpeg',.6));ed.dirty=true;render()};im.src=r.result};r.readAsDataURL(f)}
function attShow(i,src){const a=src||(ed&&ed.att||[])[i];if(!a)return;const w=window.open('');if(w){w.document.write(`<title>Attachment</title><img src="${a}" style="max-width:100%">`)}}
function attViewHTML(t){const A=t.att||[];return A.length?`<div class="row mt" style="gap:8px"><span class="muted">Attachments:</span>${A.map((a,i)=>`<span class="attc"><img src="${a}" onclick="attShow(0,db.txns.find(x=>x.id==='${t.id}').att[${i}])" alt=""></span>`).join('')}</div>`:''}

/* ---------- parties: statement, phone contacts ---------- */
function partyStmt(id,print){ui.rep='pstatement';ui.repParty=id;ui.range='all';go('reports');print?printRep():exportRep()}
function importVcf(){const i=document.createElement('input');i.type='file';i.accept='.vcf,text/vcard,text/x-vcard';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
  const cards=String(r.result).split(/BEGIN:VCARD/i).slice(1);let add=0,skip=0;
  cards.forEach(c=>{const get=re=>{const m=c.match(re);return m?m[1].trim():''};let name=get(/\nFN[^:]*:(.+)/i);if(!name){const n=get(/\nN[^:]*:(.+)/i);name=n.split(';').filter(Boolean).reverse().join(' ')}
    const tel=get(/\nTEL[^:]*:(.+)/i).replace(/[^\d+]/g,'');if(!name){skip++;return}
    if(db.parties.some(p=>p.name.toLowerCase()===name.toLowerCase()||(tel&&p.phone&&p.phone.replace(/\D/g,'').slice(-10)===tel.replace(/\D/g,'').slice(-10)))){skip++;return}
    db.parties.push({id:uid(),name,phone:tel.replace(/^\+92/,'0'),address:'',opening:0,openingType:'receive',creditLimit:0,created:Date.now()});add++});
  save();render();toast(`${add} contact(s) added${skip?`, ${skip} skipped (already there or no name)`:''}`)};r.readAsText(f)};i.click()}

/* ---------- sale growth ---------- */
function growthTxt(type,tot){const d=new Date();const f=localDate(new Date(d.getFullYear(),d.getMonth()-1,1)),to=localDate(new Date(d.getFullYear(),d.getMonth()-1,d.getDate()));
  const last=db.txns.filter(t=>t.type===type&&t.date>=f&&t.date<=to).reduce((s,t)=>s+t.total,0);if(!last)return'';const g=Math.round((tot-last)/last*100);
  return`<div style="font-size:12px" class="${g>=0?'green':'red'}">${g>=0?'▲':'▼'} ${Math.abs(g)}% vs same days last month</div>`}

/* ---------- notifications ---------- */
function notifList(){const out=[];if(!isAdmin())return out;const{st}=calc();const td=localDate();
  const low=db.items.filter(i=>!i.inactive&&i.type!=='service'&&+i.minStock>0&&st[i.id]<=+i.minStock).length;if(low&&db.settings.stockOn!==false)out.push({n:low,t:`${low} item(s) at low stock`,a:"ui.rep='lowstock';go('reports')"});
  const od=overdueParties().length;if(od)out.push({n:od,t:`${od} part${od>1?'ies have':'y has'} overdue payment`,a:"ui.rep='overdue';go('reports')"});
  if(db.settings.svcOn){const s=svcList().filter(x=>x.days<=0).length;if(s)out.push({n:s,t:`${s} service reminder(s) due`,a:"go('svc')"})}
  const ch=db.txns.filter(t=>t.mode==='Cheque'&&t.chequeStatus!=='closed'&&T[t.type].cash&&t.date<=td).length;if(ch)out.push({n:ch,t:`${ch} cheque(s) still open`,a:"ui.cbTab='cheques';go('cashbank')"});
  const so=db.txns.filter(t=>(t.type==='saleorder'||t.type==='purchaseorder')&&!t.convertedTo&&!t.cancelled&&t.dueDate&&t.dueDate<=td).length;if(so)out.push({n:so,t:`${so} order(s) due today or late`,a:"ui.rep='orders';go('reports')"});
  if(db.settings.batchOn){const ex=RUN.expiring().rows.length;if(ex)out.push({n:ex,t:`${ex} batch(es) expiring within 30 days`,a:"ui.rep='expiring';go('reports')"})}
  const bd=daysSince(db.settings.lastBackup);if(db.txns.length&&(bd===null||bd>=7)&&!bkDir)out.push({n:1,t:bd===null?'No backup taken yet':`Last backup was ${bd} days ago`,a:'backup()'});

function tallyExport(){const[f0,t0]=(()=>{const d=new Date();const y=d.getMonth()>=6?d.getFullYear():d.getFullYear()-1;return[`${y}-07-01`,`${y+1}-06-30`]})();
  openModal(`<div class="mhead"><h2>Export to Tally</h2><button class="x" onclick="closeModal()">×</button></div><div class="mbody">

  <div class="fgrid"><label class="f">From<input class="in" type="date" id="tlF" value="${f0}"></label><label class="f">To<input class="in" type="date" id="tlT" value="${t0}"></label></div></div>
  <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="tallyRun($('#tlF').value,$('#tlT').value)">Download XML</button></div>`)}
function tallyRun(f,to){const x=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const VT={sale:'Sales',salereturn:'Credit Note',purchase:'Purchase',purchasereturn:'Debit Note',paymentin:'Receipt',paymentout:'Payment',expense:'Payment',income:'Receipt'};
  const acc=t=>t.mode&&t.mode!=='Cash'&&t.mode!=='Split'&&t.mode!=='Cheque'?t.mode:'Cash';
  const L=(name,amt)=>`<ALLLEDGERENTRIES.LIST><LEDGERNAME>${x(name)}</LEDGERNAME><ISDEEMEDPOSITIVE>${amt<0?'Yes':'No'}</ISDEEMEDPOSITIVE><AMOUNT>${r2(amt).toFixed(2)}</AMOUNT></ALLLEDGERENTRIES.LIST>`;
  let n=0;const V=db.txns.filter(t=>VT[t.type]&&!t.cancelled&&t.date>=f&&t.date<=to).sort((a,b)=>a.date.localeCompare(b.date)).map(t=>{n++;const p=party(t.partyId);const pn=p?p.name:(t.partyName||'Cash');const d=t.date.replace(/-/g,'');const tot=+t.total||0;let e='';
    if(t.type==='sale')e=L(pn,-tot)+L('Sales Account',tot);else if(t.type==='salereturn')e=L('Sales Account',-tot)+L(pn,tot);
    else if(t.type==='purchase')e=L('Purchase Account',-tot)+L(pn,tot);else if(t.type==='purchasereturn')e=L(pn,-tot)+L('Purchase Account',tot);
    else if(t.type==='paymentin')e=L(acc(t),-tot)+L(pn,tot);else if(t.type==='paymentout')e=L(pn,-tot)+L(acc(t),tot);
    else if(t.type==='expense')e=L(t.category||'Expenses',-tot)+L(acc(t),tot);else if(t.type==='income')e=L(acc(t),-tot)+L(t.category||'Other Income',tot);
    const cashLeg=(t.type==='sale'||t.type==='purchase')&&+t.paid>0?(t.type==='sale'?L(acc(t),-t.paid)+L(pn,t.paid):L(pn,-t.paid)+L(acc(t),t.paid)):'';
    return`<TALLYMESSAGE xmlns:UDF="TallyUDF"><VOUCHER VCHTYPE="${VT[t.type]}" ACTION="Create"><DATE>${d}</DATE><VOUCHERTYPENAME>${VT[t.type]}</VOUCHERTYPENAME><VOUCHERNUMBER>${x(t.no)}</VOUCHERNUMBER><PARTYLEDGERNAME>${x(pn)}</PARTYLEDGERNAME><NARRATION>${x(t.notes||'')}</NARRATION>${e}</VOUCHER></TALLYMESSAGE>`+(cashLeg?`<TALLYMESSAGE xmlns:UDF="TallyUDF"><VOUCHER VCHTYPE="${t.type==='sale'?'Receipt':'Payment'}" ACTION="Create"><DATE>${d}</DATE><VOUCHERTYPENAME>${t.type==='sale'?'Receipt':'Payment'}</VOUCHERTYPENAME><VOUCHERNUMBER>${x(t.no)}-P</VOUCHERNUMBER><NARRATION>Paid with ${x(t.no)}</NARRATION>${cashLeg}</VOUCHER></TALLYMESSAGE>`:'')}).join('\n');
  const xml=`<ENVELOPE><HEADER><TALLYREQUEST>Import Data</TALLYREQUEST></HEADER><BODY><IMPORTDATA><REQUESTDESC><REPORTNAME>Vouchers</REPORTNAME><STATICVARIABLES><SVCURRENTCOMPANY>${x(db.settings.company||'')}</SVCURRENTCOMPANY></STATICVARIABLES></REQUESTDESC><REQUESTDATA>\n${V}\n</REQUESTDATA></IMPORTDATA></BODY></ENVELOPE>`;
  const b=new Blob([xml],{type:'application/xml'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`powertech-tally-${f}-to-${to}.xml`;document.body.appendChild(a);a.click();a.remove();closeModal();toast(n+' voucher(s) exported for Tally')}

function wordsIntl(n){
  n=Math.floor(Math.abs(n));if(!n)return'Zero Rupees Only';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  const bn=Math.floor(n/1e9);n%=1e9;const mn=Math.floor(n/1e6);n%=1e6;const th=Math.floor(n/1e3);n%=1e3;
  let s='';if(bn)s+=three(bn)+' Billion ';if(mn)s+=three(mn)+' Million ';if(th)s+=three(th)+' Thousand ';if(n)s+=three(n);
  return s.trim()+' Rupees Only';
}
function words(n){return db.settings.wordsFmt==='intl'?wordsIntl(n):wordsIN(n)}

const ptURef=()=>PT.fs.collection('clients').doc(PT.user.uid);
const ptCanSync=()=>PT.on&&PT.user&&PT.fs&&navigator.onLine!==false;
function ptSetSync(s){PT.sync=s;if(s==='ok')PT.lastSync=Date.now();ptChip()}
function ptSchedulePush(){if(!PT.started||PT.readOnly||!ptCanSync())return;clearTimeout(PT.pushT);PT.pushT=setTimeout(ptPushAll,2500)}
async function ptFetch(k,rm){
  const ids=[];for(let i=0;i<rm.n;i++)ids.push(`${k}~${rm.t}~${i}`);
  const docs=await Promise.all(ids.map(id=>ptURef().collection('chunks').doc(id).get()));
  if(docs.some(d=>!d.exists))throw new Error('chunks-missing');
  return docs.map(d=>d.data().d).join('')}
function ptApply(k,val){PT.applying=true;try{
    if(val==null)localStorage.removeItem(k);
    else{if(k===FIRMS_KEY){try{const j=JSON.parse(val);if(firms&&j.list&&j.list.some(f=>f.id===firms.cur))j.cur=firms.cur;val=JSON.stringify(j)}catch(e){}}
      localStorage.setItem(k,val)}}
  catch(e){toast('Storage full — cloud data could not be saved on this device.')}finally{PT.applying=false}}
function ptBusy(){return route==='editor'||route==='pos'||$('#modal').classList.contains('show')}
async function ptReconcile(k,rm,force){
  const L=PTM.keys[k]||{lm:0,st:0};
  if(!rm||rm.t<=(L.st||0))return false;
  if(PT.started&&!force&&ptBusy()){PT.pending[k]=rm;return false}
  delete PT.pending[k];
  let remote;try{remote=rm.del?null:await ptFetch(k,rm)}
  catch(e){if(e.message!=='chunks-missing')throw e;const s2=await ptURef().collection('meta').doc(k).get({source:'server'});if(!s2.exists)return false;rm=s2.data();remote=rm.del?null:await ptFetch(k,rm)}
  const local=localStorage.getItem(k);
  const dirty=(L.lm||0)>(L.st||0);
  let merged=null;
  if(local!=null&&remote!=null){merged=ptMerge(k,local,remote,(L.lm||0)>rm.t);if(ptSame(k,merged,remote))merged=null}
  else if(local!=null&&remote==null&&dirty)merged=local;
  if(merged==null){ptApply(k,remote);PTM.keys[k]={lm:rm.t,st:rm.t,rn:rm.n||0,rt:rm.t}}
  else{ptApply(k,merged);PTM.keys[k]={lm:Math.max(ptNow(),rm.t+1),st:rm.t,rn:rm.n||0,rt:rm.t};if(!PT.readOnly)ptSchedulePush()}
  ptMetaSave();
  if(k===FIRMS_KEY){loadFirms();if(PT.started&&!localStorage.getItem(dbKey())&&firms.list.length){firms.cur=firms.list[0].id}}
  if(k===dbKey()||k===FIRMS_KEY){load();if(PT.started){try{render()}catch(e){}}}
  return true}
async function ptPushKey(k,depth){
  const L=PTM.keys[k];if(!L||(L.lm||0)<=(L.st||0))return;
  const mref=ptURef().collection('meta').doc(k);
  const rs=await mref.get({source:'server'});const rm=rs.exists?rs.data():null;
  if(rm&&rm.t>(L.st||0)&&(depth||0)<3){await ptReconcile(k,rm,true);return ptPushKey(k,(depth||0)+1)}
  const val=localStorage.getItem(k),t=L.lm;
  if(val==null){await mref.set({t,n:0,del:true,dev:PT_DEV,at:ptST()})}
  else{const parts=[];for(let i=0;i<val.length;i+=PT_CFG.chunk)parts.push(val.slice(i,i+PT_CFG.chunk));
    for(let i=0;i<parts.length;i+=3){const b=PT.fs.batch();parts.slice(i,i+3).forEach((p,j)=>b.set(ptURef().collection('chunks').doc(`${k}~${t}~${i+j}`),{d:p}));await b.commit()}
    await mref.set({t,n:parts.length,len:val.length,dev:PT_DEV,at:ptST()})}
  if(rm&&!rm.del&&rm.n&&rm.t!==t){const b=PT.fs.batch();for(let i=0;i<rm.n;i++)b.delete(ptURef().collection('chunks').doc(`${k}~${rm.t}~${i}`));b.commit().catch(()=>{})}
  const L2=PTM.keys[k];L2.st=t;L2.rt=t;L2.rn=val==null?0:Math.ceil(val.length/PT_CFG.chunk);ptMetaSave()}
async function ptPushAll(){
  if(PT.readOnly||!ptCanSync())return;
  if(PT.pushing){PT.again=true;return}
  PT.pushing=true;ptSetSync('syncing');
  try{const ks=Object.keys(PTM.keys).filter(k=>(PTM.keys[k].lm||0)>(PTM.keys[k].st||0)).sort((a,b)=>a===FIRMS_KEY?-1:b===FIRMS_KEY?1:0);
    for(const k of ks)await ptPushKey(k);ptSetSync('ok')}
  catch(e){console.warn('Powertech sync',e);ptSetSync(navigator.onLine===false?'offline':'error');clearTimeout(PT.pushT);PT.pushT=setTimeout(ptPushAll,30000)}
  finally{PT.pushing=false;if(PT.again){PT.again=false;ptSchedulePush()}}}
async function ptInitialSync(){
  for(const k of ptLocalKeys())if(!PTM.keys[k])PTM.keys[k]={lm:1,st:0};ptMetaSave();
  const snap=await ptURef().collection('meta').get({source:'server'});const R={};snap.forEach(d=>R[d.id]=d.data());
  for(const k of Object.keys(R).sort((a,b)=>a===FIRMS_KEY?-1:b===FIRMS_KEY?1:0))await ptReconcile(k,R[k],true);
  if(!PT.readOnly)await ptPushAll();else ptSetSync('ok')}
function ptListen(){
  if(PT.unsubMeta)PT.unsubMeta();

    s.docChanges().forEach(ch=>{if(ch.type==='removed'||ch.doc.metadata.hasPendingWrites)return;const rm=ch.doc.data();if(rm.dev===PT_DEV)return;
      ptReconcile(ch.doc.id,rm).then(ch2=>{if(ch2)ptSetSync('ok')}).catch(e=>console.warn(e))})},e=>console.warn('listen',e))}

   ${devs.map(([id,d])=>`<div class="ptdev"><span>${esc(d.name||'Device')}${id===PT_DEV?' <b>(yeh device)</b>':''}</span></div>`).join('')}
   ${PT.mode==='view'?`<p class="red" style="font-size:13px">${esc(PT.msg)}</p>`:''}
   <div class="row mt"><button class="btn pri" onclick="closeModal();ptSyncNow()">Sync now</button><button class="btn" onclick="ptProfileForm()">Shop details</button><span class="spacer"></span><button class="btn" onclick="ptSignOut()">Logout</button></div>
   ${ptSupport()}</div>`)}
async function ptSyncNow(){if(!ptCanSync())return toast('Internet nahi hai');ptSetSync('syncing');
  try{const snap=await ptURef().collection('meta').get({source:'server'});const R={};snap.forEach(d=>R[d.id]=d.data());
    for(const k in R)await ptReconcile(k,R[k],true);if(!PT.readOnly)await ptPushAll();ptSetSync('ok');toast('Sync mukammal')}
  catch(e){console.warn(e);ptSetSync('error');toast('Sync nahi ho saka')}}
function ptProfileForm(){const c=PT.lic||{};
  openModal(`<div class="mhead"><h2>Shop details</h2><button class="x" onclick="closeModal()">×</button></div><div class="mbody">
  <p class="muted" style="font-size:13px">Yeh maloomat ${PT_CFG.support} ko activation aur support ke liye chahiye.</p>
  <label class="f">Shop / business ka naam<input class="in" id="ptPS" value="${esc(c.shop||db.settings.company||'')}"></label>
  <label class="f mt">Mobile number<input class="in" id="ptPP" inputmode="tel" value="${esc(c.phone||db.settings.phone||'')}"></label>
  <label class="f mt">Aap ka naam<input class="in" id="ptPN" value="${esc(c.name||'')}"></label>
  <div class="row mt"><span class="spacer"></span><button class="btn" onclick="closeModal()">Baad mein</button><button class="btn pri" onclick="ptProfileSave()">Save</button></div></div>`)}
async function ptProfileSave(){const shop=$('#ptPS').value.trim(),phone=$('#ptPP').value.trim(),name=$('#ptPN').value.trim();
  try{await PT.fs.collection('clients').doc(PT.user.uid).update({shop,phone,name});closeModal();toast('Saved')}catch(e){toast('Save nahi hua — internet check karein')}}

/* ---------- start-up ---------- */
const _ptRender=render;render=function(){const r=_ptRender.apply(this,arguments);try{ptBanner()}catch(e){}return r};
function ptRun(){ptGateHide();PT.started=true;loadFirms();load();boot();initAutoBackup();ptChip()}
async function ptOwnerCheck(u){
  if(PTM.owner&&PTM.owner!==u.uid){
    const dirty=Object.values(PTM.keys).some(L=>(L.lm||0)>(L.st||0));
    if(!confirm('Is device par kisi aur Gmail account ka data hai. Woh data is device se hata diya jayega (us account ke cloud par mehfooz hai).'+(dirty?'\n\nTawajjoh: kuch data abhi cloud par nahi gaya tha.':'')+'\n\nContinue?'))return false;
    PT.applying=true;try{ptLocalKeys().forEach(k=>localStorage.removeItem(k))}finally{PT.applying=false}
    PTM={owner:u.uid,keys:{}};ptMetaSave();loadFirms();load()}
  if(!PTM.owner){PTM.owner=u.uid;ptMetaSave()}
  return true}
async function ptOnUser(u){
  if(!u){if(PT.started)return location.reload();PT.user=null;ptGate('signin');return}
  if(PT.user&&PT.user.uid===u.uid&&PT.started)return;
  PT.user=u;ptGate('loading','License check ho raha hai…');
  if(!(await ptOwnerCheck(u))){try{await PT.auth.signOut()}catch(e){}return}
  let online=false;
  try{PT.lic=await ptWait(ptRegister(u),20000);ptCacheSave(PT.lic);online=true}
  catch(e){
    if(e&&e.message==='device-limit')return ptGate('limit',e);
    if(e&&e.code==='permission-denied')return ptGate('error','Permission error. Firestore rules check karein (firestore.rules publish karein).');
    const c=ptCache();
    if(c&&c.uid===u.uid){PT.lic=c;PT.offset=c.offset||0;ptApplyMode(ptEval(c,true));PT.sync='offline';ptRun();return}
    return ptGate('offline')}
  ptApplyMode(ptEval(PT.lic));
  ptGate('loading','Data cloud se sync ho raha hai…');
  try{await ptWait(ptInitialSync(),90000);ptSetSync('ok')}catch(e){console.warn('initial sync',e);ptSetSync('error')}
  ptListenLic();ptListen();ptRun();
  if(PT.isNew){PT.isNew=false;setTimeout(ptProfileForm,600)}}
async function ptStart(){
  ptInstallUI();
  if(!ptConfigured()){PT.on=false;ptChip();boot();initAutoBackup();PT.started=true;
    console.warn('Powertech: firebase-config.js set nahi — offline mode');return}
  PT.on=true;ptGate('loading');
  try{firebase.initializeApp(window.PT_FIREBASE);PT.auth=firebase.auth();PT.fs=firebase.firestore();
    try{PT.fs.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
    if(window.PT_EMU){PT.auth.useEmulator('http://127.0.0.1:9099');PT.fs.useEmulator('127.0.0.1',8080)}}
  catch(e){return ptGate('error','Firebase start nahi hua: '+e.message)}
  try{await PT.auth.getRedirectResult()}catch(e){console.warn(e)}
  let first=true;
  PT.auth.onAuthStateChanged(u=>{first=false;ptOnUser(u)});
  setTimeout(()=>{if(first&&!PT.started){const c=ptCache();if(c){PT.lic=c;PT.offset=c.offset||0;PT.user={uid:c.uid,email:c.email};ptApplyMode(ptEval(c,true));PT.sync='offline';ptRun()}}},12000)}

applyLang();loadFirms();load();ptStart();
</script>
